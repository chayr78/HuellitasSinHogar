spring.application.name=Huellitas

# Secretos locales (DB_PASSWORD, JWT_SECRET, etc.) en Huellitas/.env, que no se sube a git.
# Se busca en las dos rutas para que funcione arrancando desde la carpeta exterior o desde la del proyecto.
# En Railway no hay .env: las variables se definen en el panel del servicio.
spring.config.import=optional:file:.env[.properties],optional:file:Huellitas/.env[.properties]

# ---------- Base de datos (Supabase) ----------

# Usar la URL del Session pooler (IPv4). La conexión directa db.<ref>.supabase.co solo funciona por IPv6.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pocas conexiones por precaución con el límite de Supabase
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
# Sin el SQL en el log para no llenarlo
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Railway define PORT; en local se usa 8080
server.port=${PORT:8080}

# ---------- Aplicación ----------

# Clave HS256 de al menos 32 bytes. Vacía: se genera una aleatoria al arrancar (los tokens caducan al reiniciar)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=480

# Lista separada por comas
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Administrador inicial: se crea solo si ambos tienen valor y aún no existe ningún ADMINISTRADOR
app.admin.correo=${ADMIN_CORREO:}
app.admin.password=${ADMIN_PASSWORD:}

app.supabase.url=https://vgcyqbyxpnsgmyxmlakg.supabase.co
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.supabase.bucket=mascotas

# Con false, los correos no se envían y su contenido se escribe en el log
app.mail.enabled=false
